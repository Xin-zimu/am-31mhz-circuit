#12745e" stroke-width="2.2" stroke-dasharray=""/><text x="664" y="453" font-size="14" fill="#12614f" text-anchor="start">GND / 0</text><polyline points="980,230 1040,230 1040,330" fill="none" stroke="#12745e" stroke-width="2.2" stroke-dasharray=""/><text x="984" y="223" font-size="14" fill="#12614f" text-anchor="start">port</text><polyline points="1040,330 1040,340" fill="none" stroke="#182e38" stroke-width="2.2" stroke-dasharray=""/><polyline points="1047,340 1047,380 1033,380 1033,340 1047,340" fill="none" stroke="#182e38" stroke-width="2.2" stroke-dasharray=""/><polyline points="1040,380 1040,390" fill="none" stroke="#182e38" stroke-width="2.2" stroke-dasharray=""/><text x="1064" y="353" font-size="15" fill="#172f3b" text-anchor="start">RPORT1</text><text x="1064" y="372" font-size="14" fill="#172f3b" text-anchor="start">1Meg</text><polyline points="1040,390 1040,460" fill="none" stroke="#12745e" stroke-width="2.2" stroke-dasharray=""/><text x="1044" y="453" font-size="14" fill="#12614f" text-anchor="start">GND / 0</text><text x="80" y="505" font-size="16" fill="#172f3b" text-anchor="start">CT1：30 pF + 2–18 pF；CT2：39 pF + 2–18 pF。</text><text x="80" y="533" font-size="15" fill="#172f3b" text-anchor="start">微调起点约 10.61 / 7.15 pF；需按受控加载调谐，不能由旋角定电容。</text><text x="80" y="561" font-size="16" fill="#a43c36" text-anchor="start">tank1 / tank2 不设长测试柱：禁止直接挂普通 10 pF 探头验收。</text><rect x="1120" y="150" width="550" height="425" fill="#fff9ed" stroke="#bc8638" stroke-width="1.5" stroke-dasharray="8,5"/><text x="1150" y="186" font-size="20" fill="#855b24" text-anchor="start">可拆测量负载（不属于接收机）</text><polyline points="1200,330 1200,340" fill="none" stroke="#182e38" stroke-width="2.2" stroke-dasharray=""/><polyline points="1207,340 1207,380 1193,380 1193,340 1207,340" fill="none" stroke="#182e38" stroke-width="2.2" stroke-dasharray=""/><polyline points="1200,380 1200,390" fill="none" stroke="#182e38" stroke-width="2.2" stroke-dasharray=""/><text x="1224" y="353" font-size="15" fill="#172f3b" text-anchor="start">RMEAS1</text><text x="1224" y="372" font-size="14" fill="#172f3b" text-anchor="start">953</text><polyline points="1410,330 1410,355" fill="none" stroke="#182e38" stroke-width="2.2" stroke-dasharray=""/><polyline points="1425,355 1395,355" fill="none" stroke="#182e38" stroke-width="2.2" stroke-dasharray=""/><polyline points="1425,365 1395,365" fill="none" stroke="#182e38" stroke-width="2.2" stroke-dasharray=""/><polyline points="1410,365 1410,390" fill="none" stroke="#182e38" stroke-width="2.2" stroke-dasharray=""/><text x="1434" y="353" font-size="15" fill="#172f3b" text-anchor="start">CEXT1</text><text x="1434" y="372" font-size="14" fill="#172f3b" text-anchor="start">TBD / budget</text><polyline points="1040,230 1550,230" fill="none" stroke="#12745e" stroke-width="2.2" stroke-dasharray=""/><text x="1044" y="223" font-size="14" fill="#12614f" text-anchor="start">port</text><polyline points="1200,230 1200,330" fill="none" stroke="#12745e" stroke-width="2.2" stroke-dasharray=""/><polyline points="1200,390 1200,460" fill="none" stroke="#12745e" stroke-width="2.2" stroke-dasharray=""/><polyline points="1410,230 1410,330" fill="none" stroke="#12745e" stroke-width="2.2" stroke-dasharray=""/><polyline points="1410,390 1410,460" fill="none" stroke="#12745e" stroke-width="2.2" stroke-dasharray=""/><polyline points="1200,460 1550,460" fill="none" stroke="#12745e" stroke-width="2.2" stroke-dasharray=""/><text x="1204" y="453" font-size="14" fill="#12614f" text-anchor="start">GND / 0</text><text x="1490" y="285" font-size="18" fill="#172f3b" text-anchor="start">TP_PORT</text><text x="1490" y="311" font-size="14" fill="#172f3b" text-anchor="start">短接探头尖端</text><text x="1150" y="510" font-size="15" fill="#172f3b" text-anchor="start">探头Rin计入并联电导；CEXT不能照抄固定值。</text><text x="1150" y="537" font-size="13" fill="#172f3b" text-anchor="start">原校核：953 Ω∥RPORT 1 MΩ∥接口1 MΩ；总14 pF。</text><text x="60" y="650" font-size="16" fill="#172f3b" text-anchor="start">1  信号源内部约50 Ω → 同轴芯线 → input；屏蔽层 → GND。源阻抗不是入口并联50 Ω。</text><text x="60" y="684" font-size="16" fill="#a43c36" text-anchor="start">2  所有 tank 接点保持短小；不装长测试针、不接普通10 pF探头，也不直连示波器50 Ω。</text><text x="60" y="718" font-size="16" fill="#a43c36" text-anchor="start">3  CEXT = 14 pF − 实际探头尖端电容 − 连接寄生；探头未知时，CEXT待定，暂不验收。</text><text x="60" y="752" font-size="16" fill="#172f3b" text-anchor="start">4  普通10×探头仅在port负载预算与31 MHz传递校准满足条件后使用；DS2102E按探头手册选1 MΩ。</text><text x="60" y="786" font-size="16" fill="#172f3b" text-anchor="start">5  接真实Q1时，拆除953 Ω、CEXT及测量探头/缓冲；保留RPORT，port接CIN1再到Q1基极。</text><text x="60" y="820" font-size="16" fill="#172f3b" text-anchor="start">6  两线圈轴向初始近似正交；几何间距不是互感合格证；固定工具/地铜位置后做加载扫频。</text><text x="60" y="854" font-size="16" fill="#172f3b" text-anchor="start">7  独立port参考：中心31.030 MHz、BW1.885 MHz；工程带宽目标1.85–1.95 MHz，均非实测。</text><text x="60" y="888" font-size="16" fill="#172f3b" text-anchor="start">8  CT1物理1=S→tank1、2=R→GND；CT2同理。S/R依厂家孔位图和实物确认，不按任意视角猜。</text><text x="60" y="922" font-size="16" fill="#172f3b" text-anchor="start">9  原模型总CTUNE1=41.609801788 pF，CTUNE2=47.1490753446 pF；包含各1 pF布局寄生。</text><text x="60" y="956" font-size="16" fill="#172f3b" text-anchor="start">10 不安装RLOSS、RCT、CSELF或CBOARD离散件；不能把寄生预算再焊成一个1 pF电容。</text><circle cx="260" cy="230" r="4" fill="#11725c"/><circle cx="360" cy="230" r="4" fill="#11725c"/><circle cx="460" cy="230" r="4" fill="#11725c"/><circle cx="360" cy="460" r="4" fill="#11725c"/><circle cx="660" cy="230" r="4" fill="#11725c"/><circle cx="760" cy="230" r="4" fill="#11725c"/><circle cx="860" cy="230" r="4" fill="#11725c"/><circle cx="760" cy="460" r="4" fill="#11725c"/><circle cx="1040" cy="230" r="4" fill="#11725c"/><circle cx="1200" cy="230" r="4" fill="#11725c"/><circle cx="1410" cy="230" r="4" fill="#11725c"/><circle cx="1410" cy="460" r="4" fill="#11725c"/></g></svg>