ize="17" fill="#172f3b" text-anchor="start">实物映射：RLOSS+LSEL+CSELF → 一只132-17L；RCT+CTUNE → 固定电容+微调及其真实损耗/布局寄生。</text><text x="60" y="645" font-size="18" fill="#172f3b" text-anchor="start">41.609801788 = 30 + 10.609801788 + 1 pF；47.1490753446 = 39 + 7.1490753446 + 1 pF。</text><text x="60" y="679" font-size="16" fill="#a43c36" text-anchor="start">1 pF是模型布局预算，不是另装的电容。物理网络是该模型的实现目标，不宣称与理想网表逐值完全等效。</text><rect x="70" y="725" width="760" height="300" fill="#fff9ed" stroke="#bc8638" stroke-width="1.5" stroke-dasharray="8,5"/><text x="95" y="760" font-size="20" fill="#172f3b" text-anchor="start">基带外部总测试负载（不永久叠加）</text><polyline points="350,850 350,860" fill="none" stroke="#182e38" stroke-width="2.2" stroke-dasharray=""/><polyline points="357,860 357,900 343,900 343,860 357,860" fill="none" stroke="#182e38" stroke-width="2.2" stroke-dasharray=""/><polyline points="350,900 350,910" fill="none" stroke="#182e38" stroke-width="2.2" stroke-dasharray=""/><text x="374" y="873" font-size="15" fill="#172f3b" text-anchor="start">RBBLOAD1</text><text x="374" y="892" font-size="14" fill="#172f3b" text-anchor="start">1000000.0</text><polyline points="620,850 620,875" fill="none" stroke="#182e38" stroke-width="2.2" stroke-dasharray=""/><polyline points="635,875 605,875" fill="none" stroke="#182e38" stroke-width="2.2" stroke-dasharray=""/><polyline points="635,885 605,885" fill="none" stroke="#182e38" stroke-width="2.2" stroke-dasharray=""/><polyline points="620,885 620,910" fill="none" stroke="#182e38" stroke-width="2.2" stroke-dasharray=""/><text x="644" y="873" font-size="15" fill="#172f3b" text-anchor="start">CLOAD1</text><text x="644" y="892" font-size="14" fill="#172f3b" text-anchor="start">100p</text><polyline points="150,810 620,810 620,850" fill="none" stroke="#12745e" stroke-width="2.2" stroke-dasharray=""/><text x="154" y="803" font-size="14" fill="#12614f" text-anchor="start">final</text><polyline points="350,810 350,850" fill="none" stroke="#12745e" stroke-width="2.2" stroke-dasharray=""/><polyline points="350,910 350,970 620,970 620,910" fill="none" stroke="#12745e" stroke-width="2.2" stroke-dasharray=""/><text x="354" y="963" font-size="14" fill="#12614f" text-anchor="start">GND / 0</text><text x="900" y="770" font-size="21" fill="#172f3b" text-anchor="start">外部激励与供电</text><text x="900" y="810" font-size="15" fill="#172f3b" text-anchor="start">VMOD/BSIG：31 MHz AM数值激励，非接收机元件。</text><text x="900" y="840" font-size="15" fill="#172f3b" text-anchor="start">RSOURCE=50 Ω：发生器等效源阻抗；不额外串/并50 Ω凑数。</text><text x="900" y="870" font-size="15" fill="#172f3b" text-anchor="start">VSUP vcc 0 9：外部9 V正电源，负端接公共地。</text><text x="900" y="900" font-size="15" fill="#172f3b" text-anchor="start">RLOAD=1e15 Ω：检波开路数值残留，不采购、不焊接。</text><text x="900" y="930" font-size="15" fill="#172f3b" text-anchor="start">RCONNECT=0.1 Ω：连接等效；实物短线见主图。</text><text x="900" y="960" font-size="15" fill="#172f3b" text-anchor="start">.ic/.nodeset：暖机初值，只影响求解，不能画成真实电压源。</text><text x="900" y="990" font-size="15" fill="#172f3b" text-anchor="start">BAT85内R1/D1与OPA197宏模型内部器件不作为外部BOM。</text><text x="900" y="1020" font-size="15" fill="#172f3b" text-anchor="start">完整原值、源行号：tables/原始网表全部元件.csv。</text><circle cx="340" cy="230" r="4" fill="#11725c"/><circle cx="510" cy="230" r="4" fill="#11725c"/><circle cx="680" cy="230" r="4" fill="#11725c"/><circle cx="510" cy="550" r="4" fill="#11725c"/><circle cx="1040" cy="230" r="4" fill="#11725c"/><circle cx="1210" cy="230" r="4" fill="#11725c"/><circle cx="1380" cy="230" r="4" fill="#11725c"/><circle cx="1210" cy="550" r="4" fill="#11725c"/><circle cx="350" cy="810" r="4" fill="#11725c"/></g></svg>